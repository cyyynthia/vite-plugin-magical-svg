name: Build
on:
  push:
    branches:
      - mistress
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: { persist-credentials: false }

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with: { cache: true }

      - run: just build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist

  vitest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [20, 22, 24, 26] # Can't test earlier Node versions (Vitest requires modern Node versions)
        vite: [3, 4, 5, 6, 7, 8]
        include:
          - os: windows-latest
            node: 26
            vite: 8
          - os: macos-latest
            node: 26
            vite: 8
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with: { persist-credentials: false }

      - uses: pnpm/setup@5d160c5bc68a09337ad0d5654e237e03253b5879 # v1
        with: { cache: true, runtime: "node@${{ matrix.node }}" }

      - name: Override Vite version for matrix
        run: pnpm add -D "vite@${{ matrix.vite }}"

      - run: pnpm run test
        env:
          TEST_VITE: ${{ matrix.vite }}
          TEST_NODE: ${{ matrix.node }}
