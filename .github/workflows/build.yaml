name: Build
on:
  push:
    branches:
      - mistress
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with: { cache: true }

      - run: just build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist

  vitest:
    strategy:
      fail-fast: false
      matrix:
        # Older Node versions and Vite versions aren't compatible with Vitest
        # We'll need to test these via a more robust E2E harness
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24, 26]
        vite: [6, 7, 8]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3
        with: { cache: true, runtime: "node@${{ matrix.node }}" }

      - name: Override Vite version for matrix
        run: pnpm add -D "vite@${{ matrix.vite }}"

      - run: pnpm run test
        env:
          TEST_VITE: ${{ matrix.vite }}
          TEST_NODE: ${{ matrix.node }}
