name: CI — Tests

on:
  push:
    branches:
      - mistress
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-tests
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22, 24]
        vite: [3, 4, 5, 6, 7, 8]
        exclude:
          # Vite 7+ requires Node 20.19+ / 22.12+
          - node: 18
            vite: 7
          - node: 18
            vite: 8

    steps:
      - name: Checkout repository (safe for forks)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 #4

      - name: Use Node and cache pnpm
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f #v6
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Override Vite version for matrix
        run: pnpm add -D "vite@${{ matrix.vite }}"

      - name: Run tests
        env:
          TEST_VITE: ${{ matrix.vite }}
          TEST_NODE: ${{ matrix.node }}
        run: pnpm test
